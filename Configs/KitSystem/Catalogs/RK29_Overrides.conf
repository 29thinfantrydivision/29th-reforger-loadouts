RK29_OverrideCatalog {
 m_aOverrides {
  RK29_Override "{AB29C0FFEEB22F13}" {
   m_sId "no_etool"
   m_aAdjust {
    RK29_OverrideAdjust "{AB29C0FFEEB22F14}" {
     m_sTarget "utilities/etool"
     m_iMax 0
    }
   }
  }
  // Kits that dress their own hat (crew, pilot, sniper, parade) never wear the NVG helmet, so the
  // group is removed outright rather than offered as a section that stays greyed forever.
  RK29_Override "{AB29C0FFEEB2A300}" {
   m_sId "no_nightvision"
   m_aSubstitute {
    RK29_OverrideSubstitute "{AB29C0FFEEB2A301}" {
     m_sTarget "nightvision"
     m_sReplaceWith ""
    }
   }
  }
  // Crew and pilots: a carbine for self-defence, not a fighting load. Rifle magazines only.
  RK29_Override "{AB29C0FFEEB22F20}" {
   m_sId "reduced_rifle_ammo"
   m_aAdjust {
    RK29_OverrideAdjust "{AB29C0FFEEB22F21}" {
     m_sTarget "carbine_ammo/ball"
     m_iDefault 2
     m_iMax 6
    }
    RK29_OverrideAdjust "{AB29C0FFEEB22F22}" {
     m_sTarget "carbine_ammo/tracer"
     m_iMax 6
    }
    RK29_OverrideAdjust "{AB29C0FFEEB22F23}" {
     m_sTarget "carbine_ammo/last5"
     m_iMax 6
    }
   }
  }
  // Rifleman: six frags instead of four.
  RK29_Override "{AB29C0FFEEB22F24}" {
   m_sId "extra_grenades"
   m_aAdjust {
    RK29_OverrideAdjust "{AB29C0FFEEB22F25}" {
     m_sTarget "grenades/frag"
     m_iMin 0
     m_iDefault 6
     m_iMax 6
    }
   }
  }
  // Four hand smokes instead of two.
  RK29_Override "{AB29C0FFEEB22F26}" {
   m_sId "extra_smoke_grenades"
   m_aAdjust {
    RK29_OverrideAdjust "{AB29C0FFEEB22F27}" {
     m_sTarget "grenades/smoke"
     m_iMin 0
     m_iDefault 4
     m_iMax 4
    }
   }
  }
  // Leaders and snipers: the grenade slot holds the signal group - frags and white smoke
  // plus the coloured smokes in ONE section. Counts stay the catalog's, and an override written
  // against "grenades" still reaches it: a target follows the include.
  RK29_Override "{AB29C0FFEEB22F29}" {
   m_sId "colored_smoke_grenades"
   m_aSubstitute {
    RK29_OverrideSubstitute "{AB29C0FFEEB22F2A}" {
     m_sTarget "grenades"
     m_sReplaceWith "grenades_signal"
    }
   }
  }
 }
}
